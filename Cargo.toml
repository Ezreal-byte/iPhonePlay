[package]
name = "iphoneplay"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
description = "iPhonePlay — Windows 原生 iPhone 投屏与蓝牙键鼠控制"
build = "build.rs"

[[bin]]
name = "iPhonePlay"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "system_fonts", "accesskit", "clipboard", "wgpu", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8.9"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
raw-window-handle = "0.6"
directories = "6"
tray-icon = "0.24.2"
rfd = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.62.2", features = [
  "Foundation", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Storage_Streams", "Security_Cryptography",
  "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry",
  "Win32_Security", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell"
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
